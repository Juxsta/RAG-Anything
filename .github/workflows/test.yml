name: Test Suite

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.6.1"

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-type: [unit, integration, security]
      fail-fast: false
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for coverage

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-

    - name: Install dependencies
      run: |
        poetry install --with dev,test
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr

    - name: Set up test environment
      run: |
        echo "Creating test directories..."
        mkdir -p test_data test_output logs
        echo "Setting up test environment variables..."
        echo "TEST_MODE=true" >> $GITHUB_ENV
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV

    - name: Run unit tests
      if: matrix.test-type == 'unit'
      run: |
        poetry run pytest tests/unit/ \
          --cov=raganything \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=test-results/unit-results.xml \
          -v --tb=short
        
        echo "Unit test coverage:"
        poetry run coverage report --show-missing

    - name: Run integration tests  
      if: matrix.test-type == 'integration'
      run: |
        poetry run pytest tests/integration/ \
          --cov=raganything \
          --cov-append \
          --cov-report=xml \
          --junit-xml=test-results/integration-results.xml \
          -v --tb=short

    - name: Run security tests
      if: matrix.test-type == 'security'
      run: |
        poetry run pytest tests/security/ \
          --junit-xml=test-results/security-results.xml \
          -v --tb=short

    - name: Upload coverage to Codecov
      if: matrix.test-type == 'unit'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.test-type }}
        path: test-results/

    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      if: matrix.test-type == 'unit' && always()
      with:
        name: coverage-report
        path: htmlcov/

  performance-tests:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}

    - name: Install dependencies
      run: poetry install --with dev,test

    - name: Run performance tests
      run: |
        poetry run pytest tests/performance/ \
          --benchmark-only \
          --benchmark-json=benchmark-results.json \
          -v

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark-results.json

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}

    - name: Install dependencies
      run: poetry install --with dev,test

    - name: Start test server
      run: |
        poetry run python -m raganything.api.main &
        sleep 10  # Wait for server to start

    - name: Run end-to-end tests
      run: |
        poetry run pytest tests/e2e/ \
          --junit-xml=test-results/e2e-results.xml \
          -v --tb=short

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: test-results/

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}

    - name: Install dependencies
      run: poetry install --with dev,lint

    - name: Run linting
      run: |
        poetry run flake8 raganything/ tests/
        poetry run black --check raganything/ tests/
        poetry run isort --check-only raganything/ tests/

    - name: Run type checking
      run: poetry run mypy raganything/

    - name: Security scan
      run: |
        poetry run bandit -r raganything/ -f json -o security-report.json || true
        poetry run safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          security-report.json
          safety-report.json

  test-summary:
    runs-on: ubuntu-latest
    needs: [test, performance-tests, e2e-tests, code-quality]
    if: always()
    
    steps:
    - name: Download test results
      uses: actions/download-artifact@v3
      with:
        path: test-results/

    - name: Generate test summary
      run: |
        echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f test-results/test-results-unit/unit-results.xml ]; then
          echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Unit tests failed or not run" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f test-results/test-results-integration/integration-results.xml ]; then
          echo "✅ Integration tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Integration tests failed or not run" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f test-results/test-results-security/security-results.xml ]; then
          echo "✅ Security tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Security tests failed or not run" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f test-results/e2e-test-results/e2e-results.xml ]; then
          echo "✅ E2E tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ E2E tests skipped or failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage and Performance" >> $GITHUB_STEP_SUMMARY
        
        if [ -f test-results/coverage-report/index.html ]; then
          echo "📊 Coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f test-results/benchmark-results/benchmark-results.json ]; then
          echo "⚡ Performance benchmarks completed" >> $GITHUB_STEP_SUMMARY
        fi