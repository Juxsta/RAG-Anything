name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run full test suite daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '16'
  REDIS_VERSION: '7'

jobs:
  # Unit and Integration Tests
  unit-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run typecheck

    - name: Run linting
      run: npm run lint:check

    - name: Run unit tests
      run: npm run test -- --testPathIgnorePatterns=integration,e2e,security,performance
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
        JWT_SECRET: test-jwt-secret-key

    - name: Run integration tests
      run: npm run test:integration
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
        JWT_SECRET: test-jwt-secret-key

    - name: Generate coverage report
      run: npm run test:coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
        JWT_SECRET: test-jwt-secret-key

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: unit-integration-coverage

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: unit-integration-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security tests
      run: npm run test:security
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
        JWT_SECRET: test-jwt-secret-key

    - name: Run dependency audit
      run: npm audit --audit-level=moderate

    - name: Upload security test results
      uses: actions/upload-artifact@v3
      with:
        name: security-test-results
        path: test-results/

  # End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-integration-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
        JWT_SECRET: test-jwt-secret-key

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright E2E tests
      run: npm run test:e2e:playwright
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
        JWT_SECRET: test-jwt-secret-key

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          test-results/
          playwright-report/

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-integration-tests
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'performance')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Start application
      run: npm start &
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
        PORT: 3000

    - name: Wait for application to be ready
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/v1/health; then
            echo "Application is ready"
            break
          fi
          echo "Waiting for application... ($i/30)"
          sleep 2
        done

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run k6 performance tests
      run: npm run test:load
      env:
        BASE_URL: http://localhost:3000

    - name: Run Artillery performance tests
      run: npm run test:performance
      env:
        TARGET_URL: http://localhost:3000

    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: |
          performance-test-results.html
          performance-test-results.json

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: unit-integration-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: npm run docker:build

    - name: Test Docker container
      run: |
        docker run -d --name test-container \
          -e NODE_ENV=test \
          -e DATABASE_URL=postgresql://test:test@host.docker.internal:5432/rag_test \
          -e REDIS_URL=redis://host.docker.internal:6379 \
          -e JWT_SECRET=test-jwt-secret \
          -p 3001:3000 \
          rag-anything-api
        
        sleep 10
        
        # Test health endpoint
        curl -f http://localhost:3001/api/v1/health || exit 1
        
        docker stop test-container
        docker rm test-container

  # Deployment Readiness Check
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [unit-integration-tests, security-tests, e2e-tests]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for production
      run: npm run build

    - name: Check bundle size
      run: |
        BUNDLE_SIZE=$(du -sk dist/ | cut -f1)
        echo "Bundle size: ${BUNDLE_SIZE}KB"
        
        # Fail if bundle is too large (adjust threshold as needed)
        if [ $BUNDLE_SIZE -gt 100000 ]; then
          echo "Bundle size too large: ${BUNDLE_SIZE}KB > 100MB"
          exit 1
        fi

    - name: Deployment ready
      run: echo "✅ All checks passed - ready for deployment"

  # Generate Test Report
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [unit-integration-tests, security-tests, e2e-tests]
    if: always()

    steps:
    - name: Download all test artifacts
      uses: actions/download-artifact@v3

    - name: Generate comprehensive test report
      run: |
        mkdir -p test-report
        
        cat > test-report/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>RAG-Anything API Test Report</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                .header { background: #f4f4f4; padding: 20px; border-radius: 5px; }
                .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
                .pass { color: green; }
                .fail { color: red; }
                .pending { color: orange; }
            </style>
        </head>
        <body>
            <div class="header">
                <h1>RAG-Anything API Comprehensive Test Report</h1>
                <p><strong>Commit:</strong> ${{ github.sha }}</p>
                <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                <p><strong>Date:</strong> $(date)</p>
            </div>
            
            <div class="section">
                <h2>Test Results Summary</h2>
                <ul>
                    <li class="${{ needs.unit-integration-tests.result == 'success' && 'pass' || 'fail' }}">
                        Unit & Integration Tests: ${{ needs.unit-integration-tests.result }}
                    </li>
                    <li class="${{ needs.security-tests.result == 'success' && 'pass' || 'fail' }}">
                        Security Tests: ${{ needs.security-tests.result }}
                    </li>
                    <li class="${{ needs.e2e-tests.result == 'success' && 'pass' || 'fail' }}">
                        E2E Tests: ${{ needs.e2e-tests.result }}
                    </li>
                </ul>
            </div>
            
            <div class="section">
                <h2>Quality Metrics</h2>
                <p>Detailed coverage and performance metrics available in artifacts.</p>
            </div>
        </body>
        </html>
        EOF

    - name: Upload test report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: test-report/

# Workflow summary and notifications
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [unit-integration-tests, security-tests, e2e-tests, docker-build]
    if: always() && github.ref == 'refs/heads/main'

    steps:
    - name: Notify success
      if: needs.unit-integration-tests.result == 'success' && needs.security-tests.result == 'success' && needs.e2e-tests.result == 'success'
      run: |
        echo "✅ All tests passed successfully!"
        echo "Repository is ready for deployment."

    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Some tests failed!"
        echo "Please review the test results and fix any issues."